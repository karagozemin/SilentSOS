services:
  - type: web
    name: silentsos-engine
    runtime: node
    plan: free
    rootDir: engine
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SPEECH_ENGINE_ID
        sync: false
      - key: NODE_VERSION
        value: "20"
